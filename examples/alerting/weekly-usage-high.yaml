# Fires when the weekly subscription usage (all products combined) is above 80%.
# Needs the usage poller (--usage-poller); see "Subscription limits" in the main README.
#
# Adjust before use:
# - datasourceUid: the uid of your Prometheus datasource (Dashboard settings > JSON Model
#   on the imported dashboard, or Connections > Data sources).
# - the 0.8 threshold in the "C" query.
# - add a notification policy or a label here that routes to your contact point; this file
#   intentionally has none.
apiVersion: 1

groups:
  - orgId: 1
    name: weekly-usage-high
    folder: Claude Code
    interval: 5m
    rules:
      - uid: claude-weekly-usage-high
        title: Weekly subscription usage above 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: claude_usage_utilization_ratio{limit="weekly_all"}
              instant: true
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Weekly Claude Code usage is above 80%
          description: "Weekly usage ratio is {{ $values.A.Value }} (1.0 = the full weekly limit)."
