name: Release assets

# When a release is published, attach the dashboard JSON so it can be imported into any Grafana
# (Dashboards > New > Import) without cloning the repository.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Upload the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dashboards/claude-code.json --clobber
