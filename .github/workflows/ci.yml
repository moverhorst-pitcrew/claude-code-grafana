name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (also checks that dashboards/claude-code.json matches the generator)
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install linters
        run: pip install ruff yamllint
      - name: Python
        run: ruff check .
      - name: YAML
        run: yamllint .
      - name: Shell
        run: shellcheck install.sh
      - name: Dashboard JSON is valid
        run: python -c "import json; json.load(open('dashboards/claude-code.json'))"

  dashboard-smoke:
    # Starts the real stack, feeds it sample telemetry and runs every dashboard query against it, so a query that
    # errors (bad PromQL/LogQL/TraceQL, a wrong datasource type) fails CI instead of only showing up empty in Grafana.
    # --require-data also fails a query that returns no rows, which is what a renamed or dropped metric looks like.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Start the stack
        run: docker compose up -d
      - name: Quadlet image digest still matches its tag
        run: |
          line=$(grep -m1 '^Image=docker\.io/grafana/otel-lgtm:' quadlet/otel-lgtm.container.in)
          tag=$(echo "$line" | sed -E 's#.*otel-lgtm:([^@]+)@sha256:.*#\1#')
          pinned_digest=$(echo "$line" | sed -E 's#.*@(sha256:[0-9a-f]+).*#\1#')
          resolved_digest=$(docker buildx imagetools inspect "docker.io/grafana/otel-lgtm:$tag" --format '{{.Manifest.Digest}}')
          if [ -z "$resolved_digest" ]; then
            echo "Could not resolve the index digest for grafana/otel-lgtm:$tag from the registry" >&2
            exit 1
          fi
          echo "quadlet/otel-lgtm.container.in pins $pinned_digest for tag $tag; registry resolves $tag to $resolved_digest"
          if [ "$pinned_digest" != "$resolved_digest" ]; then
            echo "quadlet/otel-lgtm.container.in pins $pinned_digest for tag $tag, but the registry now resolves $tag to $resolved_digest. Bump the @sha256 digest to match the tag." >&2
            exit 1
          fi
      - name: Wait for Grafana
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          echo "Grafana did not become healthy in time" >&2
          exit 1
      - name: Send sample telemetry
        run: python3 tools/send_sample_telemetry.py
      - name: Wait until the telemetry is queryable
        run: python3 tools/wait_for_telemetry.py
      - name: Validate the dashboard
        run: python3 tools/validate_dashboard.py --range 3h --require-data
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
